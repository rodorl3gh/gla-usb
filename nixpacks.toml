# Universidad Superior Bajío (landing + panel admin)
# Build para Easy Panel via Nixpacks (Node 20 requerido por Next.js 16 + better-sqlite3)

[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

